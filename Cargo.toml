[package]
name = "system-monitor"
version = "3.7.0"
edition = "2021"
rust-version = "1.85"
authors = ["System Monitor Contributors"]
description = "A professional system monitoring application for Windows with GUI"
license = "MIT"
repository = "https://github.com/Xenonesis/sysmon"

[[bin]]
name = "system-monitor"
path = "src/main.rs"

[dependencies]
sysinfo = "0.30"
nvml-wrapper = "0.12"
chrono = "0.4"
eframe = "0.28"
egui = "0.28"
egui_plot = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.11"
directories = "6.0"
rfd = "0.17"
csv = "1.3"
image = { version = "0.25.9", features = ["png"] }
egui_extras = { version = "0.28.1", features = ["image"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
tray-icon = "0.24"
muda = "0.19"
parking_lot = "0.12"
ureq = { version = "2.10", features = ["json"] }
percent-encoding = "2.3"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Services", "Win32_Foundation", "Win32_System_Power", "Win32_System_Memory", "Win32_System_Registry"] }
global-hotkey = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Threading", 
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_ProcessStatus",
] }
winreg = "0.56"
ntapi = "0.4"
widestring = "1.1"
wmi = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
