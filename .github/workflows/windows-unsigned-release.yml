name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'Cargo version not found' }
          $version = $Matches[1]
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match Cargo version v$version" }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify source quality
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --no-deps | Out-Null
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin system-monitor

      - name: Prepare release artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\system-monitor.exe target\release\system-monitor.exe

          # ── Portable exe (always present, guaranteed fallback) ──
          $portableDest = "downloads\SystemMonitor-$env:APP_VERSION-setup.exe"
          Copy-Item target\release\system-monitor.exe $portableDest
          $hash = (Get-FileHash $portableDest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $portableDest -Leaf)" | Set-Content "$portableDest.sha256" -Encoding ascii
          Write-Host "Portable ready: $portableDest"

      - name: Build installer (Inno Setup)
        id: inno
        shell: pwsh
        # continue-on-error so the job never fails just because ISCC is unavailable
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss /DAppVersion=$env:APP_VERSION
          $installer = "downloads\SystemMonitor-$env:APP_VERSION-setup.exe"
          if (-not (Test-Path $installer)) { throw "ISCC produced no output file" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii
          Write-Host "Installer ready: $installer"
          "INSTALLER_BUILT=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Log installer build result
        shell: pwsh
        run: |
          if ($env:INSTALLER_BUILT -eq 'true') {
            Write-Host "Inno Setup installer built successfully."
          } else {
            Write-Host "Inno Setup step was skipped or failed — portable exe is the release asset."
          }

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: downloads
          format: spdx-json
          output-file: downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-${{ env.APP_VERSION }}
          path: |
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe.sha256
            downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          replace: true
          generate_release_notes: true
          files: |
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe.sha256
            downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json