name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches Cargo version
        id: check
        run: |
          VERSION=$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match Cargo version v$VERSION"
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Release Notes
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?s)## \[' + $env:APP_VERSION + '\] - \d{4}-\d{2}-\d{2}\s+(.*?)(?=\n## \[|$)'
          if ($changelog -match $pattern) {
              $notes = $Matches[1].Trim()
              $notes | Out-File release_notes.md -Encoding utf8
          } else {
              Write-Host "Changelog entry for $env:APP_VERSION not found!"
              "Release v$env:APP_VERSION" | Out-File release_notes.md -Encoding utf8
          }

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Verify source quality
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo metadata --locked --format-version 1 --no-deps | Out-Null
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Build release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin system-monitor

      - name: Prepare release artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\system-monitor.exe target\release\system-monitor.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss /DAppVersion=$env:APP_VERSION
          $installer = "downloads\SystemMonitor-$env:APP_VERSION-setup.exe"
          if (-not (Test-Path $installer)) { throw "ISCC produced no output file" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii
          Write-Host "Installer ready: $installer"

      - name: Generate SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: downloads
          format: spdx-json
          output-file: downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-monitor-${{ env.APP_VERSION }}
          path: |
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe.sha256
            downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: |
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe.sha256
            downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json
            target/x86_64-pc-windows-msvc/release/system-monitor.exe

      - name: Verify checksums, SBOM, and GitHub attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = "downloads\SystemMonitor-$env:APP_VERSION-setup.exe"
          $checksum = "$installer.sha256"
          $sbom = "downloads\SystemMonitor-$env:APP_VERSION.spdx.json"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer is unavailable" }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw "Checksum is unavailable" }
          if (-not (Test-Path -LiteralPath $sbom -PathType Leaf)) { throw "SBOM is unavailable" }
          $entry = (Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+'
          if ($entry.Count -ne 2) { throw "Checksum entry is malformed" }
          $expectedName = "*$(Split-Path $installer -Leaf)"
          if ($entry[1] -ne $expectedName) { throw "Checksum filename does not match installer" }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($entry[0].ToLowerInvariant() -ne $actual) { throw "Installer checksum verification failed" }
          Get-Content -LiteralPath $sbom -Raw | ConvertFrom-Json | Out-Null
          gh attestation verify $installer --repo $env:GITHUB_REPOSITORY
          gh attestation verify $checksum --repo $env:GITHUB_REPOSITORY
          gh attestation verify $sbom --repo $env:GITHUB_REPOSITORY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          body_path: release_notes.md
          replace: true
          files: |
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe
            downloads/SystemMonitor-${{ env.APP_VERSION }}-setup.exe.sha256
            downloads/SystemMonitor-${{ env.APP_VERSION }}.spdx.json
