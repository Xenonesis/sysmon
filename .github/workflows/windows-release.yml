name: Build Windows Release and Publish

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install MSVC build tools
        shell: pwsh
        run: |
          choco install -y visualstudio2019-buildtools --no-progress || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up environment for release
        shell: pwsh
        run: |
          rustup default stable

      - name: Build release
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Copy exe to host release path for installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\system-monitor.exe target\release\system-monitor.exe

      - name: Compute version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-installer
          path: downloads\SystemMonitor-*-setup.exe

      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload installer release asset (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: downloads\SystemMonitor-${{ steps.version.outputs.version }}-setup.exe
          asset_name: SystemMonitor-${{ steps.version.outputs.version }}-setup.exe
          asset_content_type: application/octet-stream
