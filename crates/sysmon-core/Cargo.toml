[package]
name = "sysmon-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.39"
nvml-wrapper = "0.13"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.11"
directories = "6.0"
csv = "1.3"
tracing = "0.1"
percent-encoding = "2.3"
parking_lot = "0.12"
ureq = "3.4"
sha2 = "0.10"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Services", "Win32_Foundation", "Win32_System_Power", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading", 
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
winreg = "0.56"
ntapi = "0.4"
widestring = "1.1"
wmi = "0.18"
